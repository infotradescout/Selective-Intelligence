name: Suggest an improvement
description: Propose a clearer, safer, or more useful behavior.
title: "[Suggestion]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Suggestions from product owners, designers, developers, and first-time users are welcome. Do not include secrets, private prompts, personal data, or proprietary code.

  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the user outcome, not the implementation you think is required.
    validations:
      required: true

  - type: textarea
    id: improvement
    attributes:
      label: What would be better?
      description: Explain the behavior you would expect to see.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Plain-language intent
        - Product design or UI/UX
        - Repository audit or realignment
        - Implementation or verification
        - Safety or privacy
        - Installation or client support
        - Documentation or discoverability
        - Other
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Public information check
      options:
        - label: I removed secrets, private prompts, personal data, and proprietary code.
          required: true
