name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Deterministic checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run deterministic controls
        run: python -B skills/selective-intelligence/scripts/eval.py controls --json

      - name: Test Council safeguards
        run: python -B skills/selective-intelligence/scripts/council.py self-test

      - name: Test behavior-evidence safeguards
        run: python -B skills/selective-intelligence/scripts/behavior_eval.py self-test

      - name: Run unit tests
        run: python -B -m unittest discover -s skills/selective-intelligence/tests -p 'test_*.py'

      - name: Verify public discovery bridge
        run: python -B tools/test_discovery_bridge.py

      - name: Verify repository-native client pointers
        run: python -B tools/test_native_pointers.py

      - name: Verify release integrity
        run: python -B skills/selective-intelligence/scripts/release.py doctor --json
