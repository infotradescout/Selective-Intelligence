name: Temporary public plugin package build

on:
  push:
    branches:
      - fix/public-publisher-name

permissions:
  contents: read

jobs:
  package:
    name: Build privacy-corrected plugin package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Build verified public plugin package
        run: python -B tools/public_plugin.py package --output-dir dist --force

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selective-intelligence-public-plugin-privacy-fix
          path: dist/selective-intelligence-plugin-1.0.6.zip
          if-no-files-found: error
          retention-days: 1
